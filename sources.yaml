# stagiaire-recruteur — sources initiales (seed de la table `sources`)
# Voir SOURCES.md pour le détail. verified: true = constaté le 2026-10-20 ; false = à vérifier par un appel réel.
# Secrets : référencés par ${VAR}, définis dans .env

version: 1

defaults:
  schedule: daily
  enabled: true
  user_agent: "StagiaireRecruteur/0.1 (+mailto:${CONTACT_EMAIL})"
  min_delay_seconds: 2

sources:
  # ───────────── API ─────────────
  - id: reliefweb_mdg
    name: ReliefWeb — Madagascar
    kind: reliefweb_api
    region: [mdg]
    priority: 1
    verified: true
    config:
      endpoint: https://api.reliefweb.int/v2/jobs
      appname: ${RELIEFWEB_APPNAME}          # doit être pré-approuvé par ReliefWeb
      body:
        preset: latest
        limit: 200
        filter: {field: country.name, value: Madagascar}
        fields:
          include: [title, url, source.name, country.name, city.name, date.created,
                    date.closing, type.name, career_categories.name, theme.name,
                    experience.name, body]

  - id: reliefweb_rss_mdg
    name: ReliefWeb — flux RSS Madagascar (repli si pas d'appname)
    kind: rss
    region: [mdg]
    priority: 1
    verified: false                          # format du flux à vérifier sur reliefweb.int/jobs
    enabled: false                           # activer seulement si reliefweb_mdg est indisponible
    config:
      url: https://reliefweb.int/jobs/rss.xml # ajouter les filtres de recherche Madagascar

  - id: reliefweb_remote_me
    name: ReliefWeb — home-based S&E / data
    kind: reliefweb_api
    region: [remote]
    priority: 2
    verified: true                           # requête et noms de catégories vérifiés le 2026-10-21
    config:
      endpoint: https://api.reliefweb.int/v2/jobs
      appname: ${RELIEFWEB_APPNAME}
      body:
        preset: latest
        limit: 200
        query: {value: "home-based OR remote OR \"home based\"", operator: OR}
        filter:
          field: career_categories.name
          value: [Monitoring and Evaluation, Information Management]
          operator: OR
        fields:                              # sans `include`, l'API ne renvoie que le titre
          include: [title, url, source.name, country.name, city.name, date.created,
                    date.closing, type.name, career_categories.name, body]

  - id: france_travail_lille
    name: France Travail — Lille 30 km
    kind: france_travail_api
    region: [lille]
    priority: 1
    verified: true
    enabled: false                           # API Offres d'emploi v2 inaccessible aux particuliers (constaté le 2026-10-20) ; Lille couvert par Adzuna + alertes e-mail
    config:
      token_url: https://entreprise.francetravail.fr/connexion/oauth2/access_token?realm=%2Fpartenaire
      search_url: https://api.francetravail.io/partenaire/offresdemploi/v2/offres/search
      client_id: ${FT_CLIENT_ID}
      client_secret: ${FT_CLIENT_SECRET}
      scope: api_offresdemploiv2             # vérifier si un scope supplémentaire est requis
      common_params: {commune: "59350", distance: 30}
      keyword_groups:
        - "data analyst"
        - "data engineer"
        - "ingénieur données"
        - "business intelligence"
        - "chef de produit data"
        - "chargé d'études"
        - "suivi évaluation"
        - "évaluation de projets"
        - "RSE données"
        - "solidarité internationale"

  - id: worldbank_procnotices_mdg
    name: Banque mondiale — avis de passation Madagascar
    kind: worldbank_procnotices
    region: [mdg]
    priority: 1
    verified: true                           # paramètres vérifiés le 2026-10-21 (voir SOURCES.md A3)
    config:
      endpoint: https://search.worldbank.org/api/v2/procnotices
      params: {format: json, project_ctry_name_exact: Madagascar,
               notice_type_exact: Request for Expression of Interest,
               rows: 100, srt: submission_date, order: desc}
      max_pages: 2
      keep_if:                               # filtré en local : le serveur ignore ces critères
        method_codes: [INDV]                 # consultants individuels ; ajouter CQS/QCBS/QBS pour les cabinets

  - id: adzuna_lille
    name: Adzuna — Lille
    kind: adzuna_api
    region: [lille]
    priority: 2
    verified: false
    enabled: false                           # payant (≈ 8 £/mois, constaté par Julien le 2026-10-20) : écarté
    config:
      endpoint: https://api.adzuna.com/v1/api/jobs/fr/search/{page}
      app_id: ${ADZUNA_APP_ID}
      app_key: ${ADZUNA_APP_KEY}
      params: {where: Lille, distance: 30, max_days_old: 7, results_per_page: 50}
      keyword_groups: ["data analyst", "data engineer", "chargé d'études", "suivi évaluation"]

  - id: csp_hauts_de_france
    name: Choisir le service public — Nord
    kind: csv_dataset
    region: [lille]
    priority: 3
    schedule: weekly
    verified: true
    enabled: false                           # robots.txt de data.gouv.fr interdit /api/1/datasets/r/ et static.data.gouv.fr/resources (constaté le 2026-10-20) : en attente de décision de Julien
    config:
      url: https://www.data.gouv.fr/api/1/datasets/r/867034a2-2fa1-41b4-bd39-c84691ea618f
      filter: {departement: "59"}            # nom de colonne à lire dans la doc du jeu de données

  # ───────────── RSS / agrégateurs ─────────────
  - id: unvacancies_all
    name: UN Vacancies — flux global
    kind: rss
    region: [global]
    priority: 1
    verified: true
    config:
      url: https://unvacancies.org/feed.xml
      field_map: {organization: category}
      local_filter: {any_text: [Madagascar, Antananarivo, home-based, remote]}

  - id: unvacancies_mdg_html
    name: UN Vacancies — page Madagascar
    kind: html_list
    region: [mdg]
    priority: 1
    verified: true
    config:
      url: https://unvacancies.org/jobs/location/madagascar
      # page Next.js rendue côté serveur (19 offres, sans pagination) ; sélecteurs sur data-* (classes Tailwind instables)
      selectors:
        item: li[data-landing-row]
        id: "@data-job-id"
        title: h3 a
        url: h3 a@href
        organization: "[data-landing-org] span.font-medium"
        location: {css: "[data-landing-org]", attr: title, regex: "· (.+)$"}
        deadline: {css: "[data-row-deadline]", attr: title, regex: "(\\d{1,2} [A-Za-z]{3} \\d{4})"}   # formes vues : « Closes 6 Nov 2026 », « in 2 days: closes 23 Oct 2026 », « today, 21 Oct 2026 at 23:59 UTC »
      defaults: {country: Madagascar}

  - id: lesopportunites_mdg
    name: Les Opportunités — Madagascar
    kind: rss
    region: [mdg]
    priority: 1
    verified: false                          # flux global ✅ ; flux pays au format WordPress à tester
    config:
      url: https://www.lesopportunites.com/pays/madagascar/feed/
      fallback_url: https://www.lesopportunites.com/feed
      local_filter: {url_contains: /opportunite/madagascar/}

  - id: ngojobsinafrica_mdg
    name: NGO Jobs in Africa — Madagascar
    kind: html_list
    region: [mdg]
    priority: 1
    verified: true
    config:
      url: https://ngojobsinafrica.com/job-location/madagascar/
      pagination: "{url}page/{n}/"
      max_pages: 3
      # le flux /feed/ existe mais ne donne que 10 offres, sans organisation : la page HTML est plus riche
      selectors:
        item: article.noo_job
        title: h2.loop-item-title a
        url: h2.loop-item-title a@href
        organization: .job-company a
        location: .job-location a
        contract: .job-type a
        posted: time.entry-date@datetime
        deadline: {css: time.entry-date, regex: "- ([A-Za-z]+ \\d+, \\d{4})$"}
      defaults: {country: Madagascar}

  - id: untalent_me_mdg
    name: UN Talent — S&E Madagascar
    kind: html_list
    region: [mdg]
    priority: 2
    verified: false                          # vérifier robots.txt avant d'activer
    enabled: false
    config:
      url: https://untalent.org/jobs/in-monitoring-evaluation/contract-all/madagascar

  - id: makesense_jobs
    name: makesense jobs
    kind: html_list
    region: [lille, remote]
    priority: 3
    verified: false
    config:
      url: https://jobs.makesense.org/fr/s/jobs/all/all
      local_filter: {any_text: [Lille, Roubaix, Villeneuve, Hauts-de-France, télétravail]}

  - id: asako_mg
    name: Asako.mg
    kind: html_list
    region: [mdg]
    priority: 3
    verified: false
    config:
      url: https://www.asako.mg/annonces      # page de liste à confirmer

  # ───────────── ATS ─────────────
  - id: exotec
    name: Exotec
    kind: workable
    region: [lille]
    priority: 3
    verified: true
    config: {account: exotec, countries: [France]}   # 83 offres dans le monde, 31 en France (widget public, un seul appel)

  - id: sopra_steria_lille
    name: Sopra Steria — Lille
    kind: sitemap_jsonld                     # plateforme carrières maison : sitemap des offres + JSON-LD JobPosting
    region: [lille]
    priority: 3
    verified: true
    config:
      sitemap: https://careers.soprasteria.com/vacanciessitemap.xml   # ~2 070 offres en France
      url_filter: "-lille-in-"               # slug « …-lille-in-villeneuve-d-ascq-france-jid-N » : 52 offres
      max_pages: 60
      defaults: {country: France}

  - id: kiabi
    name: Kiabi
    kind: smartrecruiters
    region: [lille]
    priority: 3
    verified: true
    # identifiant « Kiabi » confirmé (199 offres dans le monde) ; siège à Lezennes (métropole lilloise).
    # API SmartRecruiters : robots.txt ignoré sur décision de Julien (26/10/2026), voir SOURCES.md
    config: {company_id: Kiabi, countries: [fr], cities: [Lezennes, Lille, Roubaix, Villeneuve-d'Ascq, Wasquehal]}

  - id: ovhcloud
    name: OVHcloud
    kind: successfactors_rmk
    region: [lille]
    priority: 3
    verified: false
    config:
      base_url: https://careers.ovhcloud.com
      local_filter: {any_text: [Roubaix, Lille, Croix]}

  - id: expertise_france
    name: Expertise France
    kind: html_list                          # Gestmax : liste rendue côté serveur, pas de robots.txt (404), pas de flux
    region: [mdg, remote]
    priority: 2
    verified: true
    config:
      url: https://expertise-france.gestmax.fr/search/index/lang/en_US
      pagination: "{url}/page/{n}"           # 10 offres par page
      max_pages: 15
      date_formats: ["%Y/%m/%d %H:%M"]
      selectors:
        item: div.list-group-item
        title: {css: h2.list-group-item-heading, regex: "^(.*?)\\s*\\(New window\\)$"}
        url: a@href
        country: img[src*="ico_pays"] + strong
        city: img[src*="ico_ville"] + strong
        contract: div.text-blue-light
        deadline: {css: div.text-grey.listdiv-value, regex: "(\\d{4}/\\d{2}/\\d{2} \\d{2}:\\d{2})"}
      defaults: {organization: Expertise France, language: en}

  - id: afd
    name: AFD
    kind: cornerstone
    region: [mdg, global]
    priority: 3
    verified: false                          # liste chargée en JS
    config:
      url: https://afd.csod.com/ux/ats/careersite/5/home?c=afd

  - id: worldbank_careers
    name: Groupe Banque mondiale — carrières
    kind: cornerstone
    region: [mdg, global]
    priority: 3
    verified: false
    config:
      url: https://worldbankgroup.csod.com/ats/careersite/search.aspx?site=6

  # ───────────── HTML / PDF propres ─────────────
  - id: fid_consultants
    name: FID — consultants externes
    kind: html_list
    region: [mdg]
    priority: 1
    verified: false
    enabled: false                           # application React : la page est vide sans JavaScript, voir SOURCES.md
    config:
      url: https://recrutement.fid-server.org/consultant-externe
      extra_urls: [https://recrutement-prestataire.fid-server.org]

  - id: giz_madagascar
    name: GIZ Madagascar
    kind: pdf_page
    region: [mdg]
    priority: 2
    schedule: weekly
    verified: false                          # giz.de injoignable depuis ce poste le 21/10/2026 (timeout TCP), à revérifier
    enabled: false
    config:
      url: https://www.giz.de/madagascar
      pdf_link_pattern: "/sites/default/files/media/els-document/"
      defaults: {organization: GIZ, country: Madagascar}

  - id: helvetas_jobs
    name: Helvetas
    kind: html_list
    region: [mdg, global]
    priority: 3
    schedule: weekly
    verified: true
    config:
      url: https://www.helvetas.org/en/switzerland/who-we-are/jobs
      local_filter: {any_text: [Madagascar]}

  - id: seed_madagascar
    name: SEED Madagascar
    kind: pdf_page                           # offres en PDF (liens « Titre (PDF) » → /download_file/{uuid}/{n})
    region: [mdg]
    priority: 2
    schedule: weekly
    verified: true
    config:
      url: https://madagascar.co.uk/jobs
      pdf_link_pattern: "/download_file/"
      defaults: {organization: SEED Madagascar, country: Madagascar, language: en}

  - id: impact_initiatives
    name: IMPACT Initiatives / REACH
    kind: html_list
    region: [remote, global]
    priority: 2
    verified: true
    config:
      url: https://www.impact-initiatives.org/work-with-us/vacancies/
      try_feed_first: https://www.impact-initiatives.org/feed/

  - id: blue_ventures
    name: Blue Ventures
    kind: rss                                 # Teamtailor (détecté par scripts/detect_ats.py) : /jobs.rss
    region: [mdg]
    priority: 2
    verified: true
    config: {url: "https://careers.blueventures.org/jobs.rss"}

  - id: jirama_ami
    name: JIRAMA — AMI
    kind: rss
    region: [mdg]
    priority: 3
    schedule: weekly
    verified: false
    config: {url: "https://www.jirama.mg/feed/"}

  - id: captivea
    name: Captivea
    kind: html_list
    region: [mdg]
    priority: 3
    schedule: weekly
    verified: false
    config: {url: "https://www.captivea.com/jobs"}

  # ───────────── Alertes e-mail ─────────────
  - id: email_alerts
    name: Alertes e-mail du Gmail principal (LinkedIn, UNjobs, Impactpool, DevelopmentAid, WTTJ, APEC…)
    kind: gmail_alert
    region: [mdg, lille, remote]
    priority: 1
    verified: false
    config:
      label: alertes-emploi                   # libellé posé par un filtre Gmail sur les alertes entrantes
      processed_label: traité
      oauth_token_file: ${GMAIL_TOKEN_FILE}   # jeton OAuth (scope de lecture + modification des libellés), hors dépôt
      parsers:                                # expéditeur d'origine → parseur (adresses à relever sur les vrais e-mails)
        linkedin: {from_contains: linkedin.com}           # jobalerts-noreply@ (alertes) et jobs-noreply@ (offres similaires)
        unjobs: {from_contains: unjobs.org}
        impactpool: {from_contains: impactpool.org}
        developmentaid: {from_contains: developmentaid.info} # info@ ; envoie aussi des webinaires (0 offre lue)
        welcometothejungle: {from_contains: welcometothejungle}
        apec: {from_contains: apec.fr}
        untalent: {from_contains: untalent.org}
        unvacancies: {from_contains: unvacancies.org}     # alerts@unvacancies.org (constaté le 21/10/2026)
