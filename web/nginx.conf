# Dev : front Vue + reverse proxy vers l'API et Dagster, sans authentification (127.0.0.1 seulement).
# Prod : nginx.prod.conf.template (HTTPS + basic auth).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;  # import du fichier Excel (5 Mo côté API)

    # résolution à chaque requête (DNS de Docker) : un conteneur recréé change d'IP, sans cela
    # nginx garde l'ancienne et répond 502 jusqu'à son redémarrage
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api;
    set $dagster_upstream dagster-webserver;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;  # avec une variable, proxy_pass ne retire pas le préfixe
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /dagster/ {
        proxy_pass http://$dagster_upstream:3000;  # sans chemin : le préfixe /dagster est conservé
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
