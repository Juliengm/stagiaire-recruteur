[project]
name = "veille_pipeline"
requires-python = ">=3.12,<3.14"
version = "0.1.0"
dependencies = [
    "dagster==1.13.26",
    "dagster-postgres",
    "dagster-webserver",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "feedparser>=6.0",
    "selectolax>=0.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "veille_pipeline"
code_location_name = "veille_pipeline"
registry_modules = [
    "veille_pipeline.components.*",
]



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]

[tool.mypy]
mypy_path = ".."
ignore_missing_imports = true
explicit_package_bases = true
