storage:
  postgres:
    postgres_db:
      username: {env: POSTGRES_USER}
      password: {env: POSTGRES_PASSWORD}
      hostname: postgres
      db_name: dagster
      port: 5432
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 3
telemetry:
  enabled: false
