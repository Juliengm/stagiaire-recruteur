# Aucun port publié ici : les ports de dev sont dans docker-compose.override.yml (chargé
# automatiquement, 127.0.0.1 seulement) ; en prod seul `web` publie 80/443 (docker-compose.prod.yml).
x-dagster: &dagster
  build: {context: ., dockerfile: pipeline/Dockerfile}
  env_file: .env
  environment: {HF_HOME: /hf_cache}
  volumes: ["./credentials:/app/credentials:ro", "./cv:/app/cv:ro", "${HF_CACHE_DIR:-hf_cache}:/hf_cache"]
  depends_on: {postgres: {condition: service_healthy}}

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment: {POSTGRES_DB: postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d veille"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *dagster
    command: alembic -c db/alembic.ini upgrade head

  dagster-code:
    <<: *dagster
    command: dagster code-server start -h 0.0.0.0 -p 4000 -m veille_pipeline.definitions
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped

  dagster-webserver:
    <<: *dagster
    # préfixe /dagster en dev comme en prod (derrière nginx) : GraphQL sur /dagster/graphql
    command: dagster-webserver -h 0.0.0.0 -p 3000 --path-prefix /dagster -w /opt/dagster/home/workspace.yaml
    depends_on: [dagster-code]
    restart: unless-stopped

  dagster-daemon:
    <<: *dagster
    command: dagster-daemon run -w /opt/dagster/home/workspace.yaml
    depends_on: [dagster-code]
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: api/Dockerfile}
    env_file: .env
    # faits, termes interdits et CV en PDF (brouillons de candidature) ; jeton Gmail
    volumes: ["./credentials:/app/credentials:ro", "./cv:/app/cv:ro"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: web/Dockerfile}
    depends_on: [api, dagster-webserver]
    restart: unless-stopped

volumes:
  hf_cache:
  pgdata:
