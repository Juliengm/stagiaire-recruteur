[project]
name = "veille_api"
requires-python = ">=3.12,<3.14"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.5.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]

[tool.mypy]
mypy_path = ".."
ignore_missing_imports = true
explicit_package_bases = true
