# Front Vue + reverse proxy vers l'API. L'authentification (basic auth) arrive à l'étape 5.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;  # import du fichier Excel (5 Mo côté API)

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
