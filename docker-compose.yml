x-dagster: &dagster
  build: {context: ., dockerfile: pipeline/Dockerfile}
  env_file: .env
  environment: {HF_HOME: /hf_cache}
  volumes: ["./credentials:/app/credentials:ro", "./cv:/app/cv:ro", "${HF_CACHE_DIR:-hf_cache}:/hf_cache"]
  depends_on: {postgres: {condition: service_healthy}}

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment: {POSTGRES_DB: postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d veille"]
      interval: 5s
      retries: 20

  migrate:
    <<: *dagster
    command: alembic -c db/alembic.ini upgrade head

  dagster-code:
    <<: *dagster
    command: dagster code-server start -h 0.0.0.0 -p 4000 -m veille_pipeline.definitions
    depends_on: {migrate: {condition: service_completed_successfully}}

  dagster-webserver:
    <<: *dagster
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/home/workspace.yaml
    ports: ["3000:3000"]
    depends_on: [dagster-code]

  dagster-daemon:
    <<: *dagster
    command: dagster-daemon run -w /opt/dagster/home/workspace.yaml
    depends_on: [dagster-code]

  api:
    build: {context: ., dockerfile: api/Dockerfile}
    env_file: .env
    # 127.0.0.1 seulement : pas d'exposition publique avant l'authentification (nginx, étape 5)
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}}

volumes:
  hf_cache:
  pgdata:
