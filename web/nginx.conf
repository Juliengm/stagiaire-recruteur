# Dev : front Vue + reverse proxy vers l'API et Dagster, sans authentification (127.0.0.1 seulement).
# Prod : nginx.prod.conf.template (HTTPS + basic auth).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;  # import du fichier Excel (5 Mo côté API)

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /dagster/ {
        proxy_pass http://dagster-webserver:3000;  # sans / final : le préfixe /dagster est conservé
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
